[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "harness-pro"
version = "0.2.0"
description = "Deterministic, provider-agnostic agent harness with explicit capabilities"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
keywords = ["ai-agents", "llm", "agent-runtime", "mcp", "bedrock", "anthropic"]
dependencies = ["pydantic>=2.11,<3", "httpx>=0.28,<1", "jsonschema>=4.26,<5"]

[project.scripts]
harness-pro = "harness.cli:main"
hpro = "harness.cli:main"
harness = "harness.cli:main"

[project.optional-dependencies]
api = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1"]
snapshot = ["mcp>=1.12,<2"]
bedrock = ["botocore>=1.34,<2"]
dev = ["pytest>=8,<10", "httpx>=0.28,<1"]

[project.urls]
Homepage = "https://code-monkey-gamma.vercel.app/"
Repository = "https://github.com/dharmen8980/Harness-Pro"

[tool.setuptools.packages.find]
include = ["builder*", "harness*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
